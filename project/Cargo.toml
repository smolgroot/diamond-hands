[package]
name = "diamond-hands-studio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Diamond Hands levels, made in GBA-Studio"
publish = false

[[bin]]
# The whole game, as the code-drawn ROM plays it, with its art and music from the studio.
name = "diamond-hands-studio"
path = "src/main.rs"

[[bin]]
# Sol City, the level painted in the studio, on its own (the full game plays it too).
# `cargo build --features sol-city --bin sol-city`
name = "sol-city"
path = "src/sol_city/main.rs"
required-features = ["sol-city"]

[features]
# A dev build: every level is open on the world map, without beating the ones before.
dev = []
# Plays levels painted in the studio (logic's `studio` feature): builds the `sol-city` ROM.
sol-city = ["diamond_hands_logic/studio"]
# The route bot plays Sol City in god mode, A-ing through the dialogue, to watch the level.
demo = ["sol-city"]

[dependencies]
agb = "0.25.0"
agb_tracker = "0.25.0"
# `studio`: levels painted in GBA-Studio (Sol City) are playable in this ROM.
diamond_hands_logic = { path = "../logic", features = ["studio"] }
serde = { version = "1", default-features = false, features = ["derive"] }
pecten_studio_rt = { path = "/home/user/repos/gba-studio/runtime", features = ["agb"] }

[build-dependencies]
png = "0.17"
pecten_studio_build = { path = "/home/user/repos/gba-studio/codegen" }

# Both builds are optimized for speed, without debug info or debug strings; the matching
# nightly flags are in `.cargo/config.toml`.
[profile.dev]
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
