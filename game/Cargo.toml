[package]
name = "diamond-hands"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
agb = "0.25.0"
agb_tracker = "0.25.0"
diamond_hands_logic = { path = "../logic" }
serde = { version = "1", default-features = false, features = ["derive"] }

[profile.dev]
opt-level = 3
debug = true

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
debug = true
